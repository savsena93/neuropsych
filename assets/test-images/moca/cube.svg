<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Wireframe cube in oblique projection, matching the MoCA cube-copy
       stimulus: front face, back face offset up-right, all connectors. -->
  <g fill="none" stroke="#1B2124" stroke-width="3" stroke-linecap="square">
    <!-- front face -->
    <rect x="50" y="100" width="100" height="100"/>
    <!-- back face (offset) -->
    <rect x="90" y="60" width="100" height="100"/>
    <!-- connectors -->
    <line x1="50" y1="100" x2="90" y2="60"/>
    <line x1="150" y1="100" x2="190" y2="60"/>
    <line x1="150" y1="200" x2="190" y2="160"/>
    <line x1="50" y1="200" x2="90" y2="160"/>
  </g>
</svg>
